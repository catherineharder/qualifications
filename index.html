/* ================= Router ================= */
let pendingJob = "", pendingHL = null;
function route(){
  const raw = location.hash.slice(1) || "home";
  const hl = pendingHL; pendingHL = null;
  if(/^(s-|l-|x-)/.test(raw)){ const el=document.getElementById(raw); if(el){ el.scrollIntoView(); closeAll(); return; } }
  let [h, sub] = raw.split("~");
  let page=h, anchor=sub||null;
  if(/^g-/.test(h)){ page="glossary"; anchor=h; }
  else if(/^q-/.test(h)){ page="questions"; anchor=h; }
  const app=$("#app");
  const m=/^p([1-8])$/.exec(page);
  app.innerHTML = m ? pathwayPage(+m[1]) : ({home:homePage, plan:planPage, jobs:jobsPage, glossary:glossaryPage, questions:questionsPage, about:aboutPage}[page]||homePage)();
  const current = m ? "p" : (["home","plan","jobs","glossary","questions","about"].includes(page)?page:"home");
  if(current==="plan"){ buildForm(); renderPlan(); }
  if(current==="jobs"){
    const i=$("#jobQ"); i.addEventListener("input",filterJobs);
    $$('input[name="jst"]').forEach(r=>r.addEventListener("change",e=>{jobFilter=e.target.value; filterJobs();}));
    if(pendingJob){ const j=JOBS.find(x=>x.en===pendingJob); i.value = j ? jobName(j) : pendingJob; jobFilter="all"; const all=$('input[name="jst"][value="all"]'); if(all) all.checked=true; filterJobs(); pendingJob=""; }
  }
  if(current==="home"){ $("#homeJob").addEventListener("submit",e=>{e.preventDefault(); pendingJob=$("#homeJobQ").value; if(location.hash==="#jobs") route(); else location.hash="jobs";}); }
  const sel=$("#pathSel"); if(sel) sel.addEventListener("change",()=>{location.hash=sel.value;});
  if(["p","questions","about"].includes(current)) linkTerms(app);
  if(current==="jobs") $$(".jb",app).forEach(linkTerms);
  if(anchor){ const el=document.getElementById(anchor); if(el){ el.scrollIntoView(); if(page==="glossary") el.classList.add("hl"); } }
  else window.scrollTo(0,0);
  closeAll();
  if(hl){ const target = anchor ? (document.getElementById(anchor)?.closest("section")||document.getElementById(anchor)?.parentElement) : $(".content",app)||app; highlightIn(target, hl); }
}

/* ================= Events ================= */
function openDrawer(){ $("#drawer").hidden=false; $("#menuBtn").setAttribute("aria-expanded","true"); $("#menuClose").focus(); }
function openSearch(){ $("#search").hidden=false; $("#searchBtn").setAttribute("aria-expanded","true"); $("#q").focus(); }
function closeAll(){ $("#drawer").hidden=true; $("#search").hidden=true; $("#menuBtn").setAttribute("aria-expanded","false"); $("#searchBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").addEventListener("click",openDrawer);
$("#menuClose").addEventListener("click",closeAll);
$("#scrim").addEventListener("click",closeAll);
$("#searchBtn").addEventListener("click",openSearch);
$("#searchClose").addEventListener("click",closeAll);
$("#search").addEventListener("click",e=>{ if(e.target.id==="search") closeAll(); });
$("#q").addEventListener("input",e=>runSearch(e.target.value));
document.addEventListener("click",e=>{
  const jb=e.target.closest("a[data-job]"); if(jb){ pendingJob=jb.dataset.job; if(location.hash==="#jobs"){ e.preventDefault(); route(); } return; }
  const pj=e.target.closest("a[data-planjob]"); if(pj){ setPlanJob(pj.dataset.planjob); if(location.hash==="#plan"){ e.preventDefault(); route(); } return; }
  const hlA=e.target.closest("a[data-hl]"); if(hlA){ pendingHL=lastWords.slice(); if(location.hash===hlA.getAttribute("href")){ e.preventDefault(); route(); } return; }
  const sa=e.target.closest("a[data-scroll]"); if(sa){ e.preventDefault(); const el=document.getElementById(sa.getAttribute("href").slice(1)); if(el) el.scrollIntoView(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeAll(); if(e.key==="/" && !/input|select|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); } });
$("#langBtn").addEventListener("click",()=>{ LANG = LANG==="fr"?"en":"fr"; try{localStorage.setItem("q-lang",LANG)}catch(e){} renderShell(); const y=window.scrollY; route(); if(!/^(g-|q-)/.test(location.hash.slice(1))) window.scrollTo(0,y); });
try{ if(localStorage.getItem("q-notice")==="x") $("#notice").hidden=true; }catch(e){}
$("#noticeClose").addEventListener("click",()=>{ $("#notice").hidden=true; try{localStorage.setItem("q-notice","x")}catch(e){} });
window.addEventListener("hashchange",route);
renderShell();
route();
</script>
